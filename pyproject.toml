[project]
name = "friday"
version = "0.1.0"
description = "A fully local, always-on ambient AI"
readme = "README.md"
license = { file = "LICENSE" }
# Pinned. Arch's `python` rolls forward and a venv tracking it breaks on an unrelated
# -Syu, at which point every service fails to start at once.
requires-python = ">=3.12,<3.13"

dependencies = [
    # Config, validated at load. A typo must not silently grant an unbounded budget.
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",

    # The agent and tool library. ADR-0011: a library, not a layer owner - it is not a
    # daemon and removing it would not require replacing a layer. Typed tools, validated
    # arguments, and the strict structured output that scrutiny/score.py's parse_score
    # contract describes.
    #
    # Its Logfire integration is NOT used. Langfuse owns tracing (spec section 1) and a
    # second owner is ADR-0001. Logfire is also hosted by default, which fails section 9.
    "pydantic-ai>=1.0",
    # Node, edge and state typing for the graph layer. ADR-0012. Ships with pydantic-ai;
    # named explicitly because friday/graph/ imports it directly and the version matters.
    "pydantic-graph>=1.0",

    # Model transport. Spec section 8: LiteLLM is transport, the frameworks are policy.
    # The `openai` client here is the wire format to LiteLLM on loopback, not a cloud
    # dependency.
    "openai>=1.30",
    "httpx>=0.27",
    # The proxy itself, in the venv rather than as a `uv tool`, because
    # systemd/friday-litellm.service runs /srv/friday/.venv/bin/litellm. A uv tool lands in
    # the invoking user's ~/.local/bin, which the friday user does not have.
    "litellm[proxy]>=1.40",

    # Memory. SQLite and FTS5 come from the stdlib.
    "qdrant-client>=1.9",

    # Senses. Spec section 1: Matrix db, CalDAV, notmuch, files, browser, Home Assistant.
    "caldav>=1.3",
    "icalendar>=5.0",
    "matrix-nio>=0.24",
    # notmuch has Python bindings shipped with the C library on Arch (python-notmuch).
    # Deliberately not listed here: pip cannot install the library it binds to.

    # Tracing. Spec section 1: "You will need this at 3am." Self-hosted; the SDK points
    # at a local Langfuse, never at cloud.
    "langfuse>=2.36",

    # Voice pipeline transport. ADR-0023: VAD, turn-taking, streaming, barge-in phase 1.
    # Light without the extras; the STT and TTS adapters come with the `voice` extra.
    "pipecat-ai>=0.0.60",

    # Operational.
    "structlog>=24.1",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Weeks 4-5. Heavy wheels plus system audio libraries; kept out of the default install
# so weeks 1-3 do not wait on them.
#
# openwakeword depends on tflite-runtime, which has no cp312 wheels at the time of
# writing. It is marked optional here so `uv sync --extra dev` works on Python 3.12
# without the voice stack. When you reach week 4-5, install openwakeword separately
# (pip install openwakeword or build tflite from source) and verify the wake path
# against the guide in docs/weeks/W5.md.
voice = [
    "faster-whisper>=1.0",       # large-v3-turbo per spec section 1
    "resemblyzer>=0.1.4",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "numpy>=1.26",
    # Kokoro-82M is the default TTS. Verify the current install method in week 4-5;
    # if the wheel is not on PyPI, the week guide gives the git install instead.
    "kokoro>=0.3",
]
# voice-wake: openwakeword>=0.6 — install separately in W4-5. tflite-runtime has no
# cp312 wheels, so listing it here makes the whole lockfile unsatisfiable on 3.12.
# See docs/weeks/W5.md for the manual install path.

# Spec section 1: "vLLM only when you need throughput." Not installed by default.
throughput = ["vllm>=0.5"]

dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Three top-level packages. `scrutiny` and `supervisor` are separate from `friday`
# deliberately:
#   scrutiny   - spec section 4, ~200 lines, the one layer nobody else ships
#   supervisor - spec section 9, ~150 lines, runs as a DIFFERENT USER and must not
#                import friday.* or it inherits that code's surface area
packages = ["friday", "scrutiny", "supervisor"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108"]
"eval/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "requires_services: needs running friday-* units; skipped in a bare checkout",
    "requires_gpu: needs a CUDA device",
]
